<!DOCTYPE html>
<html lang="es">
<head>
    <title>このはヘダーです</title><link rel="stylesheet" type="text/css" href="./voluntario.css">
    <meta charset="utf-8">
</head>
<body>   
    <header>
        <nav class="top-nav">
            <div class="nav-container">
                <a class = "active" href="avistamientos.html"> Avistamientos </a> 
            </div>
            <div class="nav-container" style="background-color: #78d261; ">
                <a href = "index.html" style="color: aliceblue;"> Volver </a>
            </div>
            <div class="nav-container">
                <a href = "reporte.html"> Reportar Avistamientos </a>
            </div>
            <div class="nav-container">
                <a href = "aboutus.html"> Sobre Nosotros </a>
            </div>
        </nav>
    </header> 
    <main>
        <div class="logo">
            <a href="index.html"><img src="media/logo-aves.png" alt="logo-aves"></a>
        </div> 
        <form>
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juanito Pérez" required>
            <br>
            <label for="genero">Género</label>
            <input type="radio" id="M" name="genero" value="m" required> M
            <input type="radio" id="F" name="genero" value="f" required> F
            <input type="radio" id="O" name="genero" value="x" required> X
            <br>
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" placeholder="tu.correo@ejemplo.com" required>
            <br>
            <label for="codigo-postal">Código Postal</label>
            <input type="text" id="codigo-postal" name="codigo-postal" required>
            <br>
            <label for="region">Región</label>
            <select id="region" name="region" required>
                <option value="">Seleccione una región</option>
                <option value="arica-parinacota">Arica y Parinacota</option>
                <option value="tarapaca">Tarapacá</option>
                <option value="antofagasta">Antofagasta</option>
                <option value="atacama">Atacama</option>
                <option value="coquimbo">Coquimbo</option>
                <option value="valparaiso">Valparaíso</option>
                <option value="metropolitana">Metropolitana</option>
                <option value="ohiggins">O'Higgins</option>
                <option value="maule">Maule</option>
                <option value="nuble">Ñuble</option>
                <option value="biobio">Biobío</option>
                <option value="araucania">Araucanía</option>
                <option value="los-rios">Los Ríos</option>
                <option value="los-lagos">Los Lagos</option>
                <option value="aysen">Aysén</option>
                <option value="magallanes">Magallanes</option>
            </select>
            <br>
            <label for="fono">Teléfono</label>
            <input type="tel" id="fono" name="fono" placeholder="+56912345678" required>
            <br>
            <label for="dob">Fecha de Nacimiento</label>
            <input type="date" id="dob" name="dob" required>
            <br>
            <input type="submit" value="Enviar">
        </form> 
    </main>
    <footer>
        <div class="credits">
            <p>
                Página web hecha por : <br>
                Benjamín Kameid, 2026
            </p>
        </div>
        <img src="./media/proto_logo_base.png" alt="logo propio"> 
    </footer>
</body>
